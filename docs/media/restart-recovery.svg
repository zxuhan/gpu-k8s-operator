<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a">Restart recovery: 0.996 accuracy after a mid-flight operator kill</text>
  <text x="40" y="62" font-size="13" fill="#475569">Chaos run on kind: 50 pods, 10 pods/s, 60s runtime, 0.1 CPU per pod. Operator pod deleted between snapshots.</text>

  <line x1="80" y1="320" x2="580" y2="320" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="260" x2="580" y2="260" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="80" y1="200" x2="580" y2="200" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="80" y1="140" x2="580" y2="140" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="80" y1="80"  x2="580" y2="80"  stroke="#e2e8f0" stroke-dasharray="3 3"/>

  <text x="70" y="324" font-size="11" fill="#64748b" text-anchor="end">0.00</text>
  <text x="70" y="264" font-size="11" fill="#64748b" text-anchor="end">0.25</text>
  <text x="70" y="204" font-size="11" fill="#64748b" text-anchor="end">0.50</text>
  <text x="70" y="144" font-size="11" fill="#64748b" text-anchor="end">0.75</text>
  <text x="70" y="84"  font-size="11" fill="#64748b" text-anchor="end">1.00</text>
  <text x="32" y="200" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(-90 32 200)">accuracy ratio (reported / expected)</text>

  <rect x="150" y="89.6" width="160" height="230.4" fill="#0ea5e9" rx="4"/>
  <text x="230" y="125" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">0.960</text>
  <text x="230" y="342" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Clean baseline</text>
  <text x="230" y="360" font-size="12" fill="#475569" text-anchor="middle">steady-state bench, t = 45s</text>

  <rect x="380" y="80.96" width="160" height="239.04" fill="#22c55e" rx="4"/>
  <text x="460" y="117" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">0.996</text>
  <text x="460" y="342" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">After mid-flight kill</text>
  <text x="460" y="360" font-size="12" fill="#475569" text-anchor="middle">chaos run, t = 120s</text>

  <g transform="translate(620,100)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">Recovery summary</text>
    <line x1="0" y1="10" x2="240" y2="10" stroke="#cbd5e1"/>
    <text x="0" y="34" font-size="13" fill="#475569">tracked pods lost</text>
    <text x="240" y="34" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">0</text>
    <text x="0" y="58" font-size="13" fill="#475569">persisted state replayed</text>
    <text x="240" y="58" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">none</text>
    <text x="0" y="82" font-size="13" fill="#475569">vs clean baseline</text>
    <text x="240" y="82" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">matches</text>
    <text x="240" y="98" font-size="11" fill="#64748b" text-anchor="end">0.996 vs 0.960 (within rounding)</text>
    <line x1="0" y1="114" x2="240" y2="114" stroke="#cbd5e1"/>
    <text x="0" y="138" font-size="12" fill="#64748b" font-style="italic">consumedGpuHours is recomputed</text>
    <text x="0" y="154" font-size="12" fill="#64748b" font-style="italic">every reconcile from the live</text>
    <text x="0" y="170" font-size="12" fill="#64748b" font-style="italic">API-server view, so there is no</text>
    <text x="0" y="186" font-size="12" fill="#64748b" font-style="italic">cache to lose on restart.</text>
  </g>
</svg>
